set -g mouse on
# screen mode
set -sg escape-time 10
# `tmux-256color`, not `screen-256color`. The screen entry predates tmux and is
# missing capabilities tmux 3.x can use, and it caps colour at 256; the override
# hands true colour through to anything that asks.
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on
# 50k, down from 200k. Thirteen panes at the old cap held 1.34 GB of scrollback,
# and with swap full that memory was paged out — scrolling back through it became
# a disk read, which is what "tmux feels slow" actually was (measured 9 Oct 2026:
# tmux footprint 2.1 GB, 2.1 GB of it swapped out, server CPU 0.3%).
#
# Applies only to panes created AFTER it is set — tmux copies the limit into each
# pane at birth and never revisits it, so existing panes keep what they were born
# with. `clear-history` is the only way to reclaim those, and it is all-or-nothing
# (no count argument, and history-limit is a session option, not a pane one).
set -g history-limit 50000
set -g buffer-limit 20
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
# `allow-rename off` stays: that governs the screen-style \ek escape, which lets a
# program overwrite the window name outright. Leaving it off is what protects a
# name you set by hand.
setw -g allow-rename off

# Claude Code writes its current task into the PANE title (OSC 2), e.g.
# "✳ Explorer API 调用审查" — ✳ idle, ⠐ working. So the tab can just show that.
setw -g automatic-rename on
# zsh titles its panes ":/some/path", which is noise in a tab; those fall back to
# the process name. Claude's titles never start with ":". 25 chars then an ellipsis.
setw -g automatic-rename-format '#{?#{m::*,#{pane_title}},#{pane_current_command},#{=/25/…:pane_title}}'
# <prefix> , renames by hand — tmux then leaves that window alone permanently.
# <prefix> T hands the tab back to Claude.
bind T { setw automatic-rename on ; display-message "tab follows the task again" }
setw -g aggressive-resize on


# use <prefix> s for horizontal split
bind s split-window -v -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
# use <prefix> v for vertical split
bind v split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# use <prefix> h/j/k/l to go to pane left/below/above/right.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Key bindings for adjusting panes size
bind-key K resize-pane -U # up
bind-key J resize-pane -D # down
bind-key L resize-pane -R # right
bind-key H resize-pane -L # left
bind-key m resize-pane -Z # maximize

set-window-option -g mode-keys vi
list-keys -T copy-mode-vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# reload key
bind-key R source-file ~/.tmux.conf \; display-message "Reload .."

# Seperator colors for current pane — bright + bold so the active pane pops
set-option -g pane-active-border-style 'fg=colour203,bold'
# Seperator color for other panes — dim grey so they recede
set-option -g pane-border-style fg=colour240
# Thicker line on the active pane's border (single line on the rest)
set-option -g pane-border-lines heavy
# Arrow indicator pointing at the active pane on the shared border
set-option -g pane-border-indicators arrows
# Colors for the status bar
set -g status-bg 'black' # background
set -g status-fg 'white' # foreground
# ----- Windows -----

# Status format for the current window
setw -g window-status-current-format '#[fg=blue,bold]✔ #[fg=white,bold]#W'

# Status format for other windows
setw -g window-status-format '#[fg=white]#I #W'

# Seperator between each window names
set -wg window-status-separator '  '

# Show alert if other window changes?
setw -g monitor-activity off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# BEFORE tpm, deliberately. tmux-continuum schedules its saves by appending
# `#(continuum_save.sh)` to status-right (continuum.tmux:38-42) and letting the
# status redraw call it. Setting status-right *after* tpm overwrote that hook and
# continuum silently stopped saving — the last snapshot was 29 days stale when this
# was found, so a reboot would have restored a month-old layout.
set -g status-right '#{b:pane_current_path} | %H:%M'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
